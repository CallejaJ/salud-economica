<!doctype html><html><head><meta charset="utf-8">
<!-- Source of public/og.png (1200×630). Render with tools/scripts/og.mjs. Logo only, centered, so square crops (WhatsApp) still show it. -->
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse 50% 60% at 50% 50%,rgba(20,184,166,.16),transparent 70%),#0f172a}
body::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(148,163,184,.16) 1.1px,transparent 1.5px);background-size:16px 16px}
.mark{position:relative;width:300px;height:300px;border-radius:64px;background:#273449;border:1px solid #334155;display:flex;align-items:center;justify-content:center;box-shadow:0 40px 80px -30px rgba(2,6,23,.9)}
</style></head><body>
<div class="mark"><img src="../../public/images/logo.svg" width="220" height="220" alt=""></div>
</body></html>
